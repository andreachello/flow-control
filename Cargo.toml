[package]
name = "flowcontrol"
version = "0.1.0"
edition = "2021"
description = "Flow control: version control tracks files, flow control tracks what your product does."

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
walkdir = "2"

[dev-dependencies]
walkdir = "2"
