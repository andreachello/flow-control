.pal-i .bdg{flex:none;width:20px;height:20px;box-shadow:none}
.pal-none{padding:28px 16px;text-align:center;font-size:14px;color:var(--ink-3)}
.pal-f{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3)}
.keys{padding:18px 20px 20px}
.keys h3{margin:0 0 12px;font-size:15px;font-weight:600}
.keys dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0;font-size:13.5px}
.keys dt{color:var(--ink-2)}
.keys dd{display:flex;gap:4px;justify-content:flex-end;margin:0}
.toast{position:fixed;z-index:50;left:50%;bottom:24px;padding:7px 13px;border-radius:9px;background:var(--ink);box-shadow:0 12px 28px -8px rgba(24,24,27,.5);font-size:13px;color:var(--sheet);transform:translateX(-50%);animation:rise .14s ease-out}

  const list = !!document.querySelector("[data-row]");
  if (list && (k === "j" || k === "k")) { e.preventDefault(); return moveCursor(k === "j" ? 1 : -1); }
  if (list && KB && e.key === "Enter" && !e.target.closest("a,button")) { e.preventDefault(); if (!OPEN.delete(KB)) OPEN.add(KB); return drawChanges(); }
  if (list && KB && k === "d") { location.hash = hash("change", KB); return; }
  const plain = !!$("cv");
  if (plain || $("ex-bar")) { const at = LIST.findIndex(c => c.id === (plain ? CUR : D && D.commit.id)), to = LIST[at + (e.key === "[" ? -1 : e.key === "]" ? 1 : 0)];
    if ((e.key === "[" || e.key === "]") && to) location.hash = hash(plain ? "change" : "explore", to.id);
    if (k === "a") location.hash = hash(plain ? "explore" : "change", plain ? CUR : D.commit.id);
    if (k === "b") location.hash = hash("changes"); }
});

/* new work appears without a reload */
let SEEN = "";
async function watch(){
  if (document.hidden) return;
  try { const list = await get("/api/projects"), text = JSON.stringify(list); if (text === SEEN) return; SEEN = text; PROJ = list;
    const me = list.find(p => p.name === P), fresh = me && TOTAL ? me.changes - TOTAL : 0;
    $("live").innerHTML = fresh > 0 ? `<button class="live" id="live-b"><i></i>${plural(fresh, "new change")}</button>` : "";
    if (fresh > 0) $("live-b").onclick = () => { LIST = []; MORE = true; TOTAL = 0; ACT = null; CAT = null; $("live").innerHTML = ""; route(); };
  } catch {}
}
setInterval(watch, 20000);

addEventListener("hashchange", () => { const v = $("view"); route(); scrollTo(0, 0); v.classList.add("enter"); setTimeout(() => v.classList.remove("enter"), 240); });
(async () => { try { PROJ = await get("/api/projects"); } catch {} route(); })();
</script>
