<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>

:root{
  --a:#2563eb; --b:#9333ea; --ok-soft:#ecf8f1; --warn-soft:#fdf6e3; --paper:#f7f7f8; --sheet:#ffffff; --sheet-2:#f4f4f5; --ink:#18181b; --ink-2:#52525b; --ink-3:#71717a; --rule:#e4e4e7;
  --signal:#c62a1f; --signal-soft:#fbeae7;
  --add:#ecf6ef; --add-ink:#1d6b41; --add-mark:#cfe9d8; --del:#fbeef0; --del-ink:#9b2c43; --del-mark:#f1d3d9;
  --hover:#e9eef2;
  --l-li:#7b5ea7; --l-su:#1e7fc8; --l-ca:#00965e; --l-up:#e8a200; --l-ag:#d6457b; --l-pl:#8c9aa5; --l-te:#0f8b8d; --l-or:#d9622b; --l-in:#4657c7; --l-ol:#6f8a1e;
  --k:#6a3fa8; --s:#8a4b12; --n:var(--ink); --f:var(--ink); --c:#7a848b; --p:var(--ink-2);
  --f-ui:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif; --f-code:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --a:#60a5fa; --b:#c084fc; --ok-soft:#17291f; --warn-soft:#2f2813; --paper:#16191c; --sheet:#1d2125; --sheet-2:#24292e; --ink:#eef1f3; --ink-2:#c5ccd2; --ink-3:#97a2ab; --rule:#343b42;
    --signal:#ff6b5f; --signal-soft:#3a2321;
    --add:#1a2b22; --add-ink:#8fdcb0; --add-mark:#25402f; --del:#2f1f23; --del-ink:#f2a5b4; --del-mark:#4a2a32;
    --hover:#2a3138;
    --l-li:#a387d4; --l-su:#4ea7ec; --l-ca:#2fc488; --l-up:#ffbf2e; --l-ag:#f2709f; --l-pl:#8b9aa6; --l-te:#3cc4c6; --l-or:#f48a55; --l-in:#8795f0; --l-ol:#a9c648;
    --k:#c7a8f5; --s:#e5b07e; --n:var(--ink); --f:var(--ink); --c:#8c979f; --p:var(--ink-2);
  }
}
:root[data-theme="dark"]{
  --paper:#16191c; --sheet:#1d2125; --sheet-2:#24292e; --ink:#eef1f3; --ink-2:#c5ccd2; --ink-3:#97a2ab; --rule:#343b42;
  --signal:#ff6b5f; --signal-soft:#3a2321;
  --add:#1a2b22; --add-ink:#8fdcb0; --add-mark:#25402f; --del:#2f1f23; --del-ink:#f2a5b4; --del-mark:#4a2a32;
  --hover:#2a3138;
  --l-li:#a387d4; --l-su:#4ea7ec; --l-ca:#2fc488; --l-up:#ffbf2e; --l-ag:#f2709f; --l-pl:#8b9aa6; --l-te:#3cc4c6; --l-or:#f48a55; --l-in:#8795f0; --l-ol:#a9c648;
  --k:#c7a8f5; --s:#e5b07e; --n:var(--ink); --f:var(--ink); --c:#8c979f; --p:var(--ink-2);
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-ui)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--l-su);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 72px}
nav{background:var(--ink);color:var(--paper)}
nav .in{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;align-items:stretch;gap:24px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:22px;height:22px}
.tabs{display:flex;margin-left:auto;overflow-x:auto}
.tabs a{display:flex;align-items:center;padding:0 14px;color:color-mix(in srgb,var(--paper) 70%,transparent);text-decoration:none;font-weight:500;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--paper)}
.tabs a.on{color:var(--paper);border-bottom-color:var(--l-up)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-width:0}
.code{font:13px/1.75 var(--f-code);font-variant-ligatures:none;overflow-x:auto;padding:6px 0 10px}
.row{display:grid;grid-template-columns:46px 30px 18px minmax(0,1fr);white-space:pre;border-left:3px solid transparent;padding-right:16px}
.row .dots{display:flex;gap:2px;align-items:center;padding-left:8px}
.row .dots i{width:7px;height:7px;border-radius:50%}
.row .ln{color:var(--ink-3);text-align:right;padding-right:4px;user-select:none}
.row .mk{text-align:center;user-select:none;color:var(--ink-3)}
.row.own{display:block;font:600 12.5px var(--f-ui);color:var(--ink-3);padding:12px 16px 0 97px;white-space:normal}
.row.ed{background:var(--signal-soft);border-left-color:var(--signal)}
.row.hover{background:var(--hover)}
.row.add{background:var(--add)} .row.add .mk{color:var(--add-ink)}
.row.del{background:var(--del)} .row.del .mk{color:var(--del-ink)}
.row.add mark{background:var(--add-mark);color:inherit;border-radius:2px}
.row.del mark{background:var(--del-mark);color:inherit;border-radius:2px}
.row.hunk{grid-template-columns:1fr;padding:4px 16px 4px 84px;color:var(--ink-3);background:var(--sheet-2);font-size:12px}
.row.cm{color:var(--signal);font-weight:600;background:var(--signal-soft)}
.row.unpl{background:color-mix(in srgb,var(--l-up) 14%,transparent)}
.t-k{color:var(--k)} .t-s{color:var(--s)} .t-n{color:var(--n)} .t-f{color:var(--f)} .t-c{color:var(--c);font-style:italic} .t-p{color:var(--p)}
.ok-t{color:var(--add-ink);font-weight:600} .bad-t{color:var(--signal);font-weight:600}
.sheet.focus{box-shadow:0 0 0 2px var(--ink);transition:box-shadow .3s}
.flash-add{animation:flashA 1.6s ease both}
.flash-del{animation:flashD 1.6s ease both}
.flash-bad{animation:flashB 1.6s ease both}
.explain{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;border-top:1px solid var(--rule);padding-top:12px}
.explain h4{margin:0 0 2px;font-weight:600;font-size:14px;color:var(--ink-3)}
.explain p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink);max-width:68ch}
.explain p code{font:600 13.5px var(--f-code);background:var(--sheet-2);padding:1px 5px;border-radius:3px}
.theme{order:3;align-self:center;background:none;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);color:inherit;border-radius:4px;padding:5px 10px;font-size:13px;font-weight:600;margin-left:12px}
nav .in .tabs{order:2}
nav{background:#1b1f23;color:#eef1f3}
nav .tabs a{color:#aeb7be}
nav .tabs a.on,nav .tabs a:hover{color:#fff}
.theme{border-color:#4a5259}
.sheet{border-radius:16px;border:1px solid var(--rule);box-shadow:0 1px 2px rgba(24,24,27,.04),0 6px 20px -8px rgba(24,24,27,.06);overflow:hidden}
.sheet.focus{box-shadow:0 0 0 2px var(--ink),0 6px 20px -8px rgba(24,24,27,.12)}
.code{font-size:12.5px;line-height:1.7}
body{font-size:15px;line-height:1.55;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);color:var(--ink);border-bottom:1px solid var(--rule)}
nav .in{min-height:56px;align-items:center}
.brand{font-weight:600;font-size:15px;letter-spacing:-.012em}
nav .tabs{gap:2px;padding:3px;background:var(--sheet-2);border-radius:12px;align-self:center}
nav .tabs a{color:var(--ink-2);border-bottom:0;padding:6px 14px;border-radius:9px;font-size:14px}
nav .tabs a:hover{color:var(--ink)}
nav .tabs a.on{color:var(--ink);background:var(--sheet);box-shadow:0 1px 2px rgba(24,24,27,.08)}
.theme{border:1px solid var(--rule);border-radius:10px;padding:6px 12px;background:var(--sheet);color:var(--ink-2);font-weight:500}
.bad-t,.ok-t{font-weight:500}
.row.add mark,.row.del mark{border-radius:4px;padding:1px 2px}
.tty{padding:12px 20px 18px;font:12.5px/1.65 var(--f-code);font-variant-ligatures:none}
.ex3{display:grid;grid-template-columns:236px minmax(0,1fr) 320px;gap:12px;height:calc(100vh - 172px);min-height:480px}
.ex3 > .sheet{min-height:0;display:flex;flex-direction:column}
.ex-tree{overflow-y:auto;padding:12px 8px;font-size:13.5px}
.tt{padding:0 10px 8px;font-weight:600;font-size:13.5px}
.tfile{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;border-radius:8px;padding-top:5px;padding-bottom:5px;padding-right:10px;text-align:left;color:var(--ink-2)}
.tfile:hover{background:var(--sheet-2)}
.tfile.on{background:var(--sheet-2);color:var(--ink);font-weight:500}
.tfile.ch span{color:var(--ink);font-weight:500}
.tfile small{font-size:12px;white-space:nowrap}
.tfile small i{font-style:normal}
.ex-head{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 20px;border-bottom:1px solid var(--rule);flex:none}
.ex-head b{font:500 13.5px var(--f-code);overflow-wrap:anywhere}
.ex-head .same{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.seg{margin-left:auto;display:inline-flex;gap:2px;padding:3px;background:var(--sheet-2);border-radius:10px;flex:none}
.seg button{border:0;background:none;border-radius:8px;padding:3px 10px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(24,24,27,.08)}
.ex-body{flex:1;min-height:0;overflow:auto}
.ex-flow{overflow-y:auto}
.fl-h{padding:14px 18px 6px}
.fl-j{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:500}
.fl-j span{display:inline-flex;align-items:center;gap:8px}
.fl-j i{width:14px;height:5px;border-radius:3px}
.fl-h small{display:block;margin-top:5px;color:var(--ink-3);font-size:12.5px}
.row.sel:not(.add):not(.del){background:var(--sheet-2)}
.ex-bar{margin-top:4px;display:flex;align-items:center;gap:8px;min-height:32px;margin-bottom:12px;font-size:13.5px}
.bar-c{color:var(--ink-2);text-decoration:none}
.bar-c:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.bar-sl{color:var(--ink-3)}
.cp{position:relative;min-width:0}
.bar-now{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.bar-now:hover{background:var(--sheet-2)}
.bar-now .chev{margin:0 1px 2px;transform:rotate(45deg)}
.bar-now .chev.up{margin-bottom:-2px;transform:rotate(225deg)}
.bar-pos{margin-left:auto;font-size:13px;color:var(--ink-3)}
.bar-s{padding:4px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-weight:500;color:var(--ink);text-decoration:none}
.bar-s.off{background:none;color:var(--ink-3)}
.cp-menu{position:absolute;z-index:6;top:36px;left:0;width:340px;max-width:calc(100vw - 32px);padding:5px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);box-shadow:0 1px 2px rgba(24,24,27,.05),0 12px 32px rgba(24,24,27,.14)}
.cp-menu button{display:block;width:100%;padding:6px 9px;border:0;border-radius:8px;background:none;text-align:left}
.cp-menu button:hover,.cp-menu button.on{background:var(--sheet-2)}
.cp-menu b{display:block;font-size:13.5px;font-weight:500;line-height:1.3;color:var(--ink)}
.cp-menu span{display:block;margin-top:1px;font-size:12px;color:var(--ink-3)}
.ex-cards{display:none;margin:4px auto 0}
.ghl-top{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.ghl-top h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.012em}
.ghl-n{margin-left:auto;font-size:13px;color:var(--ink-3)}
.ghl{position:relative;padding-left:22px}
.ghl::before{content:"";position:absolute;left:5px;top:8px;bottom:24px;width:2px;background:var(--rule)}
.ghl-day{position:relative;padding-bottom:16px}
.ghl-day::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);box-shadow:0 0 0 3px var(--paper)}
.ghl-day.quiet::before{background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink-3),0 0 0 3px var(--paper)}
.ghl-day h3{margin:0 0 7px;font-size:13px;font-weight:500;line-height:20px;color:var(--ink-3)}
.ghl-day ol{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.ghc{position:relative;padding:12px 12px 12px 16px;cursor:pointer}
.ghc + .ghc{border-top:1px solid var(--rule)}
.ghc-line{display:flex;align-items:center;gap:16px}
.ghc-main{flex:1;min-width:0}
.ghc-t{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ghc-title{padding:0;border:0;background:none;font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.008em;text-align:left;color:var(--ink);cursor:pointer}
.ghc.quiet .ghc-title{font-weight:400;color:var(--ink-3)}
.ghc-js{flex:none;display:flex;gap:4px}
.ghc-js .bdg,.ghl-key .bdg{width:20px;height:20px;box-shadow:none}
.ghc-js .bdg + .bdg{margin-left:0}
.ghc-js .bdg.off{background:none!important;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule);opacity:.55}
.ghl-key{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 0 18px;font-size:12.5px;color:var(--ink-2)}
.ghl-key > span{display:inline-flex;align-items:center;gap:6px}
.key{margin-top:6px}
.key summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-3);font-size:13.5px;width:max-content}
.key summary::-webkit-details-marker{display:none}
.key summary::before{content:"?";width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;background:var(--sheet-2);color:var(--ink-2)}
.key summary:hover{color:var(--ink)}
.key p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);max-width:80ch}
.hfoot{margin:14px 4px 0}
.ghl-hint{margin:0 0 18px;font-size:13px;color:var(--ink-2)}
.ghl-hint code{font:12.5px var(--f-code)}
.ghc-loose{margin:8px 0 0;font-size:12.5px;color:var(--ink-3)}
.fl-sub{margin:2px 0 6px 31px!important}
.fl-sub .fl-jr{padding:4px 8px;font-size:13px}
.fl-sub .fl-jr b{font-weight:500;overflow-wrap:anywhere}
.ghc:hover{background:var(--sheet-2)}
.ghc-r{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;width:128px;font-size:12.5px;color:var(--ink-3)}
.ghc-who{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.ghc-av{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sheet-2);box-shadow:inset 0 0 0 1px var(--rule);font-size:10.5px;font-weight:600;color:var(--ink-2)}
.ghc-sha{position:relative;display:inline-flex;color:var(--ink-3);opacity:0;transition:opacity .1s}
.ghc:hover .ghc-sha,.ghc-sha:focus-within{opacity:1}
.ghc-r .chev{margin:0 4px 0 0}
.ghc-r .chev.up{transform:rotate(45deg)}
.ghc-foot{display:flex;justify-content:flex-end;margin-top:12px}
.ghc-foot .bar-s{font-size:13.5px}
a.bar-s:hover{background:var(--sheet-2)}
.ghc-sha code{position:absolute;right:calc(100% + 4px);top:50%;z-index:3;padding:3px 7px;border-radius:6px;background:var(--ink);color:var(--sheet);font:12px var(--f-code);white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(-50%);transition:opacity .1s}
.ghc-sha:hover code,.ghc-sha:focus-within code{opacity:1}
.ghc-sha button{display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:7px;background:none;color:var(--ink-3);cursor:pointer}
.ghc-sha button:hover{background:var(--sheet-2);color:var(--ink)}
.ghc-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.ghc-body p{margin:0;max-width:66ch;font-size:14.5px;line-height:1.95}
.ghc-body .part{cursor:inherit}
.ghc-title:focus-visible,.ghc-sha button:focus-visible{outline:2px solid var(--l-su);outline-offset:1px}
@media (max-width:760px){ .ghc-line{flex-direction:column;align-items:flex-start;gap:8px} .ghc-r{width:auto} .ghc-sha{opacity:1} }
@media (prefers-reduced-motion: reduce){ .ghc-sha,.ghc-sha code{transition:none} }

.tpr:hover,.tpr.on{background:var(--sheet-2)}

.ex-fh:first-child{border-top:0}

.ex-fh small i{font-style:normal}
.tpr b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.tpr span{display:block;font-size:12.5px;color:var(--ink-3)}
.tpr-m code{font:12px var(--f-code)}

.fl-h{padding:16px 18px 14px}

    ${BOOK.length ? `<div class="ghl-key">${BOOK.map((b, g) => `<span>${gbadge(g)}${esc(b.title)}</span>`).join("")}</div>` : LIST.length ? `<p class="ghl-hint">These letters are single requests, not journeys yet. Run <code>flow journeys</code> to group them into what people come to do.</p>` : ""}
    ${LIST.length ? `<div class="ghl">${days.map(d => `<section class="ghl-day ${d.rows.every(([c]) => calm(c)) ? "quiet" : ""}"><h3>${esc(when(d.date))}</h3><ol>${d.rows.map(([c, i]) => commitRow(c, i)).join("")}</ol></section>`).join("")}</div>
    
    ${MORE ? `<button class="more" id="more">Show older changes</button>` : ""}
    <details class="key hfoot"${READ ? " open" : ""}><summary>How to read this</summary><p>Each row is one saved change. A colored icon shows which journey the change is about. Open a row to see what changed, then Show details for everything behind it.</p></details>` : `<div class="pj-empty"><b>Nothing saved yet</b><p>This project has no commits.</p></div>`}</div>`);
  const read = document.querySelector(".hfoot"); if (read) read.ontoggle = () => { READ = read.open; };
  document.querySelectorAll("[data-row]").forEach(r => r.onclick = e => { if (e.target.closest("[data-copy],a") || String(getSelection())) return; const id = r.dataset.row; if (!OPEN.delete(id)) OPEN.add(id); drawChanges(); });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { try { navigator.clipboard.writeText(b.dataset.copy).catch(() => {}); } catch {} });
  const m = $("more"); if (m) m.onclick = async () => { m.disabled = true; await more(); drawChanges(); fill(); };
}
// The list comes straight from git. What each change reaches takes a lift, so it arrives after.
async function fill(){
  const mine = ++wants;
  for (;;) {
    const ids = LIST.filter(c => !SUMM[c.id]).slice(0, 4).map(c => c.id);
    if (!ids.length || mine !== wants) return;
    try { Object.assign(SUMM, await get(api("summaries", `?ids=${ids.join(",")}`))); }
    catch { for (const id of ids) SUMM[id] = { journeys:[], focus:[], line:"Could not read this change", untouched:0 }; }
    if (mine === wants && $("view").querySelector(".ghl")) { const y = scrollY; drawChanges(); scrollTo(0, y); }
  }
}
async function changes(){ nav("changes"); await ensureList(); drawChanges(); fill(); }

/* explore */
async function explore(id){
  nav("explore"); await ensureList();
  id = id || (LIST[0] && LIST[0].id);
  if (!id) return page(`<div class="pj-empty"><b>Nothing saved yet</b><p>This project has no commits.</p></div>`);
  wants++;
  if (!D || !D.commit.id.startsWith(id)) {
    page(`<div class="pj-empty"><b>Reading this change</b><p>Lifting the code before and after it. A large repo takes a few seconds.</p></div>`);
    D = await get(api("commit/" + id));
    curFile = null; scope = { all:true }; selSid = null; whole = false; cache = {}; exOpen = null; exJourney = null; exGroup = null; exPick = false; exAll = false;
  }
  page(`<div class="ex-bar" id="ex-bar"></div><div class="ex3"><nav class="sheet ex-tree" id="ex-tree" aria-label="Files"></nav><div class="sheet ex-diff"><div class="ex-head" id="ex-head"></div><div class="ex-body" id="ex-body"><div class="code" id="ex-file"></div></div></div><div class="sheet ex-flow" id="ex-flow"></div></div><details class="key hfoot"><summary>How to read this</summary><p>The left column is the files this change touched. The middle column is what a git diff shows. The right column is what a diff can't show: what changes for people, in plain words. Click a phrase to see the step behind it, and open a <b>journey</b> to see the requests and steps it runs.</p></details>`);
  draw(true);
}
const CHG = () => Object.fromEntries(D.files.map(f => [f.path, f]));
const inScope = () => !scope ? [] : D.changes.filter(c => scope.sid ? c.sid === scope.sid : scope.all ? true : c.file === scope.file);
const reached = c => D.journeys.filter(j => c.journeys.includes(j.title)).map(j => j.title);

function barHTML(){
  const i = LIST.findIndex(c => c.id === D.commit.id), step = (k, label) => LIST[k] ? `<a class="bar-s" href="${hash("explore", LIST[k].id)}" title="${esc(LIST[k].title)}">${label}</a>` : `<span class="bar-s off">${label}</span>`;
  const menu = !exPick ? "" : `<div class="cp-menu">${LIST.map(c => `<a class="${c.id===D.commit.id?"on":""}" href="${hash("explore", c.id)}"><b>${esc(c.title)}</b><span>${esc(when(c.date))}, ${short(c.id)}</span></a>`).join("")}</div>`;
  return `<a class="bar-c" href="${hash("changes")}">Changes</a><span class="bar-sl">/</span><div class="cp"><button class="bar-now" data-pick aria-expanded="${exPick}">${esc(D.commit.title)}<i class="chev ${exPick?"up":""}"></i></button>${menu}</div>
    <span class="bar-pos">${i >= 0 ? `${i+1} of ${TOTAL}` : short(D.commit.id)}</span>${step(i-1, "Newer")}${i >= 0 ? step(i+1, "Older") : ""}`;
}
function treeHTML(){
  const add = D.files.reduce((n, f) => n+f.add, 0), del = D.files.reduce((n, f) => n+f.del, 0);
  const list = D.files.map(f => { const i = f.path.lastIndexOf("/"), base = f.path.slice(i+1), dir = i < 0 ? "" : f.path.slice(0, i);
    return `<button class="tfile tchg ${f.path===curFile?"on":""}" data-p="${esc(f.path)}" title="${esc(f.path)}"><span><b>${esc(base)}</b><em>${f.status==="A"?"new":f.status==="D"?"deleted":f.status==="R"?"moved":esc(dir)}</em></span><small>${stat(f)}</small></button>`; }).join("");
  return `<button class="tpr ${curFile?"":"on"}" data-commit><b>${esc(D.commit.title)}</b><span class="tpr-m"><code>${short(D.commit.id)}</code> by ${esc(D.commit.author)}</span><span>${esc(new Date(D.commit.date + "T12:00:00").toLocaleDateString("en-GB", { day:"numeric", month:"short" }))}, ${plural(D.files.length, "file")} ${add?`<i class="ok-t">+${add}</i>`:""} ${del?`<i class="bad-t">−${del}</i>`:""}</span></button>${list}${D.hidden ? `<div class="tnote">${plural(D.hidden, "generated file")} not shown</div>` : ""}`;
}
function rowsHTML(rows, sids){
  let h = "", prev;
  for (const r of rows) {
    if (r[0] === "@") { h += `<div class="row hunk">${esc(r[1])}</div>`; prev = undefined; continue; }
    const sid = r[5], cls = r[0]==="+"?"add":r[0]==="-"?"del":"", at = sid ? `data-fn="${esc(sid)}"` : "";
    if (sid && sid !== prev && (sids.has(sid) || !sids.size)) h += `<div class="row own" ${at}>${esc(sid.split("#").pop())}${D.labels[sid] && D.labels[sid] !== sid.split("#").pop() ? `<span class="own-p">${esc(D.labels[sid])}</span>` : ""}</div>`;
    prev = sid;
    h += `<div class="row ${cls}" ${at}><span class="dots"></span><span class="ln">${r[0]==="+" ? r[2] : r[1]}</span><span class="mk">${r[0]==="-"?"−":r[0]==="+"?"+":""}</span><span>${hl(r[3]) || " "}</span></div>`;
  }
  return h;
}
const fileBits = f => f.binary ? `<div class="fl-empty"><b>Binary file</b><p>Tracked by content, with nothing to show as text.</p></div>` : f.rows.length ? rowsHTML(f.rows, new Set(D.changes.map(c => c.sid))) + (f.cut ? `<div class="fl-empty"><p>This file is too long to show in full.</p></div>` : "") : `<div class="fl-empty"><p>Only the name changed.</p></div>`;

async function draw(jump = false){
  const bar = $("ex-bar"); if (!bar) return;
  bar.innerHTML = barHTML(); bar.querySelector("[data-pick]").onclick = e => { e.stopPropagation(); exPick = !exPick; draw(); };
  $("ex-tree").innerHTML = treeHTML();
  const ch = CHG(), f = ch[curFile], stacked = !curFile, code = $("ex-file");
  $("ex-head").innerHTML = stacked ? `<b>${D.files.length === 1 ? "1 file" : `All ${D.files.length} files`}</b>` : `<b>${esc(curFile)}</b>` + (!f ? `<span class="same">No changes in this file</span>`
    : f.status==="A" ? `<span class="same">New file</span>` : f.status==="D" ? `<span class="same">Deleted</span>` : f.binary ? "" : `<span class="seg"><button class="${whole?"":"on"}" data-w="0">Diff</button><button class="${whole?"on":""}" data-w="1">Whole file</button></span>`);
  if (stacked) code.innerHTML = D.files.length ? D.files.map(x => `<button class="ex-fh" data-p="${esc(x.path)}"><span>${esc(x.path)}</span><small>${x.status==="A"?"new ":x.status==="D"?"deleted ":x.status==="R"?"moved ":""}${stat(x)}</small></button>${fileBits(x)}`).join("") : `<div class="fl-empty"><b>No file changed</b></div>`;
  else if (f && !whole) code.innerHTML = fileBits(f);
  else { const key = (f ? "whole:" : "file:") + curFile, want = curFile;
    if (!cache[key]) { code.innerHTML = `<div class="fl-empty"><p>Reading the file.</p></div>`;
      try { cache[key] = (await get(api((f ? "whole/" : "file/") + D.commit.id, `?path=${encodeURIComponent(curFile)}${f && f.from ? `&from=${encodeURIComponent(f.from)}` : ""}`))).rows; }
      catch (e) { code.innerHTML = `<div class="fl-empty"><p>${esc(e.message)}</p></div>`; return; }
      if (curFile !== want) return; }
    code.innerHTML = rowsHTML(cache[key], new Set(f ? D.changes.map(c => c.sid) : [])); }
  flow();
  code.querySelectorAll(".row[data-fn]").forEach(r => { const sid = r.dataset.fn, c = D.changes.find(x => x.sid === sid);
    if (c) { r.classList.add("pick"); if (r.classList.contains("own")) { r.tabIndex = 0; r.setAttribute("role", "button"); }
      r.onclick = () => { if (String(getSelection())) return; const base = curFile ? { file:curFile } : { all:true }; scope = scope && scope.sid === sid ? base : { ...base, sid }; selSid = null; exOpen = null; draw(); }; }
    if (scope && scope.sid === sid) r.classList.add("act");
    if (selSid === sid) r.classList.add("sel");
    r.onmouseenter = () => code.querySelectorAll(".row[data-fn]").forEach(x => x.classList.toggle("hover", x.dataset.fn === sid));
    r.onmouseleave = () => code.querySelectorAll(".row.hover").forEach(x => x.classList.remove("hover")); });
  document.querySelector("#ex-tree [data-commit]").onclick = () => { curFile = null; selSid = null; whole = false; scope = { all:true }; exOpen = null; draw(); $("ex-body").scrollTop = 0; };
  document.querySelectorAll("#ex-tree [data-p], #ex-file .ex-fh").forEach(b => b.onclick = () => { openFile(b.dataset.p); $("ex-body").scrollTop = 0; });
  document.querySelectorAll("#ex-head [data-w]").forEach(b => b.onclick = () => { whole = b.dataset.w === "1"; draw(true); });
  const box = $("ex-body"), first = code.querySelector(".row.sel") || code.querySelector(".row.act") || (whole ? code.querySelector(".row.add,.row.del") : null);
  if (jump) box.scrollTop = first ? box.scrollTop + first.getBoundingClientRect().top - box.getBoundingClientRect().top - 40 : 0;
}
function openFile(p){ exAll = false; curFile = p; selSid = null; whole = false; exOpen = null; scope = CHG()[p] ? { file:p } : null; draw(); }
function openStep(sid){ const file = sid.split("#")[0], c = D.changes.find(x => x.sid === sid), ch = CHG();
  curFile = file; selSid = null; whole = false;
  if (c && ch[file]) scope = { file, sid }; else { selSid = sid; whole = !!ch[file]; scope = ch[file] ? { file } : null; }
  draw(true); }
// Real commits hold dozens of facts, so the ones reaching the most journeys come first, a few at a
// time. Tests change no journey, so they are counted rather than listed.
// What a function reaches, said as journeys once there are journeys, and as requests until then.
const groupsHit = c => groupsOf(D.journeys.filter(j => c.journeys.includes(j.title)));
const named = c => BOOK.length ? groupsHit(c).map(g => BOOK[g].title) : reached(c);
const marks = (c, most) => { if (!BOOK.length) return badges(reached(c), most); const gs = groupsHit(c); return gs.slice(0, most).map(g => gbadge(g)).join("") + (gs.length > most ? `<span class="bdg-more">+${gs.length - most}</span>` : ""); };
const proseOf = (parts, live) => parts.map(p => { const open = live && exOpen === p.step;
  return (live ? `<span class="part ${open?"on":""}" role="button" tabindex="0" aria-expanded="${open}" data-part="${esc(p.step)}">${esc(p.say)}</span>` : `<span class="part">${esc(p.say)}</span>`) + `<span class="bdgs" ${live ? `data-part="${esc(p.step)}"` : ""}>${p.groups.map(g => gbadge(g)).join("")}</span>`; }).join(" ");
function cardHTML(c, say){ const ns = named(c);
  return `<div class="fl-open ${exFresh?"pop":""}" role="group" aria-label="This change"><i class="caret"></i>
    <div class="fo-top"><span class="fo-b">${marks(c, 3)}</span><span class="fo-j">${ns.length === 1 ? esc(ns[0]) : ns.length ? plural(ns.length, BOOK.length ? "journey" : "request") : "Nothing runs this"}</span><button class="fo-x" data-close aria-label="Close">${CLOSE}</button></div>
    <p>${esc(say)}</p><dl>${ns.length > 1 ? `<div><dt>${BOOK.length ? "Journeys" : "Requests"}</dt><dd>${esc(ns.join(", "))}</dd></div>` : ""}<div><dt>Step</dt><dd>${esc(c.label)}</dd></div><div><dt>File</dt><dd><code>${esc(c.file)}</code></dd></div>${c.facts.length > 1 ? `<div><dt>Also</dt><dd>${esc(c.facts.slice(1).join(". "))}</dd></div>` : ""}</dl>
    ${c.kept ? `<button class="fo-code" data-code="${esc(c.sid)}">Show the code</button>` : ""}</div>`; }
function proseHTML(list){
  const whole = scope && scope.all && !scope.sid, written = D.parts.filter(p => list.some(c => c.sid === p.step));
  if (D.commit.quiet) return `<p class="fl-head">${esc(D.commit.title)}</p>`;
  if (written.length) { const open = written.find(p => p.step === exOpen), c = open && list.find(x => x.sid === open.step);
    return `${whole ? `<p class="fl-head">${esc(D.commit.title)}</p>` : ""}<p class="fl-prose">${proseOf(written, true)}</p>${c ? cardHTML(c, open.say) : ""}`; }
  const code = list.filter(c => !c.test).sort((a, b) => reached(b).length - reached(a).length), tests = list.length - code.length, shown = exAll ? code : code.slice(0, 7);
  const parts = shown.map(c => { const on = exOpen === c.sid;
    return `<li class="fl-c"><span class="part ${on?"on":""}" role="button" tabindex="0" aria-expanded="${on}" data-part="${esc(c.sid)}"><b>${esc(c.label)}</b> ${esc(c.note)}</span><span class="bdgs" data-part="${esc(c.sid)}">${marks(c, 3)}</span></li>`; }).join("");
  const c = list.find(x => x.sid === exOpen), card = c ? cardHTML(c, c.note) : "";
  const head = scope && scope.all && !scope.sid ? D.head : null;
  const extra = code.length > shown.length ? `<button class="fl-more" data-more>Show ${code.length - shown.length} more</button>` : "";
  return `${head ? `<p class="fl-head">${esc(head)}</p>` : ""}<ul class="fl-list">${parts}</ul>${extra}${tests ? `<p class="fl-tests">${plural(tests, "test")} changed too</p>` : ""}${card}`;
}
function timeline(j, list){
  const hit = s => s.kind !== "same" && (!scope || scope.all && !scope.sid || list.some(c => c.file === s.file && c.label === s.label));
  const keep = new Set(); j.steps.forEach((s, i) => { if (hit(s)) [i-1, i, i+1].forEach(k => keep.add(k)); });
  const fold = n => `<li class="tl-fold">${plural(n, "step")}</li>`; let out = "", hidden = 0;
  j.steps.forEach((s, i) => { if (!keep.has(i)) { hidden++; return; } if (hidden) { out += fold(hidden); hidden = 0; }
    const kind = !hit(s) ? "" : s.kind==="new" ? "add" : s.kind==="gone" ? "del" : "ed", tag = kind==="add" ? "New step" : kind==="del" ? "Removed step" : "";
    out += `<li class="tl-s ${kind}"><button data-step="${esc(s.file)}" data-label="${esc(s.label)}"><b>${esc(s.label)}</b>${kind ? `<span>${tag ? `<em>${tag}</em> ` : ""}${esc((s.facts||[])[0] || "")}</span>` : ""}</button></li>`; });
  if (hidden) out += fold(hidden);
  return `<ol class="tl" style="--c:${j.group != null && BOOK[j.group] ? tint(j.group) : colour(j.title)}">${out}</ol>`;
}
function journeysHTML(list){
  const hit = j => !scope || (scope.all && !scope.sid) || list.some(c => c.journeys.includes(j.title));
  const on = D.journeys.filter(hit);
  const request = (j, small) => { const n = j.steps.filter(s => s.kind !== "same").length, open = exJourney === j.uid, sub = j.state==="new" ? "New" : j.state==="gone" ? "Removed" : n ? plural(n, "change") : "Renamed";
    return `<li><button class="fl-jr" data-j="${esc(j.uid)}" aria-expanded="${open}">${small ? "" : badge(j.title)}<b>${esc(j.title)}</b><small>${sub}</small><i class="chev ${open?"up":""}"></i></button>${j.was ? `<div class="fl-was">Renamed from ${esc(j.was)}</div>` : ""}${open ? timeline(j, list) : ""}</li>`; };
  if (!BOOK.length) { const rest = D.journeys.filter(j => !hit(j)).map(j => j.title).concat(D.others);
    return `<div class="fl-all"><h4>${plural(on.length, "request")} changed</h4><ol>${on.map(j => request(j)).join("")}</ol>${rest.length ? `<details class="fl-rest"><summary>${plural(rest.length, "other request")}, no change</summary><ol>${rest.map(t => `<li><div class="fl-jr same">${badge(t)}<b>${esc(t)}</b></div></li>`).join("")}</ol></details>` : ""}</div>`; }
  const gs = groupsOf(on), loose = on.filter(j => j.group == null), rest = BOOK.map((b, g) => g).filter(g => !gs.includes(g));
  const sub = (g, mine) => exGroup === g ? `<ol class="fl-sub">${mine.map(j => request(j, true)).join("")}</ol>` : "";
  const group = g => { const mine = on.filter(j => j.group === g), open = exGroup === g, n = list.filter(c => !c.test && groupsHit(c).includes(g)).length || mine.length;
    return `<li><button class="fl-jr" data-g="${g}" aria-expanded="${open}">${gbadge(g)}<b>${esc(BOOK[g].title)}</b><small>${plural(n, "change")}</small><i class="chev ${open?"up":""}"></i></button>${sub(g, mine)}</li>`; };
  const same = g => `<li><div class="fl-jr same">${gbadge(g)}<b>${esc(BOOK[g].title)}</b><small>No change</small></div></li>`;
  const none = loose.length ? `<li><button class="fl-jr" data-g="-1" aria-expanded="${exGroup === -1}"><b>Not in a journey yet</b><small>${plural(loose.length, "request")}</small><i class="chev ${exGroup === -1?"up":""}"></i></button>${sub(-1, loose)}</li>` : "";
  return `<div class="fl-all"><h4>All journeys</h4><ol>${gs.map(group).join("")}${rest.map(same).join("")}${none}</ol></div>`;
}
function placeCard(){
  const card = document.querySelector("#ex-flow .fl-open"), part = document.querySelector("#ex-flow .part.on"), host = document.querySelector("#ex-flow .fl-h");
  if (!card || !part || !host) return;
  const h = host.getBoundingClientRect(), r = [...part.getClientRects()].at(-1);
  card.style.top = `${r.bottom - h.top + host.scrollTop + 9}px`;
  card.querySelector(".caret").style.left = `${Math.max(14, Math.min(r.left - h.left - 12 + Math.min(r.width/2, 30), h.width - 54))}px`;
}
function flow(){
  const list = inScope(), box = $("ex-flow"), c = scope && scope.sid ? D.changes.find(x => x.sid === scope.sid) : null;
  const narrow = c ? `<div class="fl-scope"><b>${esc(c.label)}</b><button data-all>${scope.all ? "Show the whole commit" : `Show all of ${esc(scope.file.split("/").pop())}`}</button></div>` : "";
  const nobody = !D.journeys.length && !list.length;
  box.innerHTML = !scope ? `<div class="fl-empty"><b>Nothing changed in this file</b><p>Pick a changed file to see what changes for people.</p></div>`
    : nobody || (!list.length && !scope.all) ? `${narrow}<div class="fl-empty"><b>No change for people</b><p>Nothing runs this code, so nobody will notice.</p></div>`
    : `${narrow}<div class="fl-h"><h3>What changes for people</h3>${proseHTML(list)}${journeysHTML(list)}</div>`;
  const keep = fn => { const h = document.querySelector("#ex-flow .fl-h"), y = h ? h.scrollTop : 0; fn(); flow(); const n = document.querySelector("#ex-flow .fl-h"); if (n) n.scrollTop = y; placeCard(); };
  box.querySelectorAll("[data-part]").forEach(p => { const go = () => keep(() => { exOpen = exOpen === p.dataset.part ? null : p.dataset.part; exFresh = !!exOpen; });
    p.onclick = go; if (p.tabIndex === 0) p.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }; });
  box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => keep(() => { const g = +b.dataset.g; exGroup = exGroup === g ? null : g; exJourney = null; }));
  box.querySelectorAll("[data-j]").forEach(b => b.onclick = () => keep(() => { exJourney = exJourney === b.dataset.j ? null : b.dataset.j; }));
  box.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { const m = D.changes.find(x => x.file === b.dataset.step && x.label === b.dataset.label); if (m) openStep(m.sid); else if (D.tree.includes(b.dataset.step)) openFile(b.dataset.step); });
  const code = box.querySelector("[data-code]"); if (code) code.onclick = () => { const sid = code.dataset.code; exOpen = null; openStep(sid); };
  const showMore = box.querySelector("[data-more]"); if (showMore) showMore.onclick = () => keep(() => { exAll = true; });
  const shut = box.querySelector("[data-close]"); if (shut) shut.onclick = () => keep(() => { exOpen = null; });
  const all = box.querySelector("[data-all]"); if (all) all.onclick = () => { scope = scope.all ? { all:true } : { file:scope.file }; draw(); };
  exFresh = false; placeCard();
}
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (exOpen) { exOpen = null; flow(); } if (exPick) { exPick = false; draw(); } });
document.addEventListener("click", e => { if (exPick && e.target.isConnected && !e.target.closest(".ex-bar")) { exPick = false; draw(); }
  if (exOpen && e.target.isConnected && !e.target.closest(".fl-open,[data-part]")) { exOpen = null; flow(); } });

/* where you are */
async function route(){
  const parts = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  try {
    if (parts[0] !== "p") return await projects();
    const name = decodeURIComponent(parts[1]);
    if (name !== P) { P = name; LIST = []; MORE = true; SUMM = {}; OPEN = new Set(); D = null; }
    if (parts[2] === "explore") await explore(parts[3]); else await changes();
  } catch (e) { failed(e); }
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
route();
