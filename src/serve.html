  const plain = !!$("cv");
  if (plain && k === "c") return setCompact(!COMPACT);
  if (plain || $("ex-bar")) { const at = LIST.findIndex(c => c.id === (plain ? CUR : D && D.commit.id)), to = LIST[at + (e.key === "[" ? -1 : e.key === "]" ? 1 : 0)];
    if ((e.key === "[" || e.key === "]") && to) location.hash = hash(plain ? "change" : "explore", to.id);
    if (k === "a") location.hash = hash(plain ? "explore" : "change", plain ? CUR : D.commit.id);
    if (k === "b") location.hash = hash("changes"); }
});

/* new work appears without a reload */
let SEEN = "";
async function watch(){
  if (document.hidden) return;
  try { const list = await get("/api/projects"), text = JSON.stringify(list); if (text === SEEN) return; SEEN = text; PROJ = list;
    const me = list.find(p => p.name === P), fresh = me && TOTAL ? me.changes - TOTAL : 0;
    $("live").innerHTML = fresh > 0 ? `<button class="live" id="live-b"><i></i>${plural(fresh, "new change")}</button>` : "";
    if (fresh > 0) $("live-b").onclick = () => { $("live").innerHTML = ""; dropLoaded(); route(); };
  } catch {}
}
setInterval(watch, 20000);

addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
(async () => {
  const me = await get("/api/me"); SOBA = !!me.soba; if ($("soba-go")) $("soba-go").hidden = !SOBA;
  if (me.required && !me.user) return signedOut();
  if (me.user) { ME = me.user; signedIn(me.user); }
  if (location.search.includes("signin=")) history.replaceState(null, "", "/" + location.hash);
  // What this tab last knew draws at once. The home page then checks it against the server.
  const last = kept("flow-home"); if (last) { PROJ = last.list; HOME = last.home; }
  if (!PROJ.length) try { PROJ = await get("/api/projects"); } catch {}
  route();
})();
